[project]
name = "laya-svc"
version = "0.1.0"
description = "Vexa System-1 decision service — laya checkpoint behind laya.v1 + MCP"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# The torch-land runtime + the MCP attachment. Unit tests run WITHOUT these
# (the judge port is faked) so gate:python never downloads a checkpoint.
runtime = ["laya==0.3.20"]
mcp = ["fastmcp>=2.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_svc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
